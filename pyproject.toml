[project]
name = "weather-dashboard-bot"
version = "0.1.0"
description = "SMHI weather anomaly dashboard + Telegram bot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "python-telegram-bot>=21.0",
  "scikit-learn>=1.5.0",
  "numpy>=1.26.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4.0",
  "python-dateutil>=2.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*"]
